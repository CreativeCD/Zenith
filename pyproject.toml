[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zenith-ai"
version = "1.0.0"
description = "Zenith — Autonomous AI Coding Harness & Interactive Claude Code CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zenith Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "tiktoken>=0.5.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "google-genai>=0.1.1",
    "google-generativeai>=0.8.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.20.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.2",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9"
]

[project.scripts]
zencode = "harness.cli:main"
zicode = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "billing*"]
